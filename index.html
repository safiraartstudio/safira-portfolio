<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafiraWolfFox — Portfólio</title>
<!-- EDITAR: coloque o arquivo do ícone em img/favicon.png (ideal: quadrado, 32x32 ou 64x64) -->
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="hero">

  <!-- EDITAR: troque o src pela sua imagem/recorte "saltado" da tela.
       Sem moldura, sem fundo — use PNG com fundo transparente pra dar
       o efeito de a arte estar solta sobre a página. -->
  <img
    class="hero-img fade-item"
    style="--delay:0s"
    src="img/personagem.png"
    alt="Seu personagem/logo"
    onerror="this.classList.add('img-missing')">

  <h1 class="hero-title fade-item" style="--delay:0.3s">SAFIRA WOLF FOX</h1>
  <p class="hero-subtitle fade-item" style="--delay:0.5s">Veja meu trabalho nas minhas redes</p>

  <!-- EDITAR: troque o href pelo link real do seu Telegram (ex: https://t.me/seu_usuario) -->
  <div class="social-row fade-item" style="--delay:0.7s">
    <a class="social-btn" href="https://t.me/tafirawolffox" target="_blank" title="Telegram">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.6 20c-.2 1-.8 1.2-1.6.8l-4.5-3.3-2.2 2.1c-.2.2-.4.4-.9.4l.3-4.6 8.4-7.6c.4-.3-.1-.5-.5-.2L6.3 13 1.9 11.6c-1-.3-1-1 .2-1.4L20.5 3c.8-.3 1.6.2 1.4 1.3Z"/></svg>
    </a>
  </div>

  <!-- ===== CAIXA COM BOTÕES DE PÁGINA (TOS, etc.) =====
       Copie o bloco <a class="link-card">...</a> pra adicionar novos itens. -->
  <div class="links-section fade-item" style="--delay:0.9s">

    <a class="link-card" href="pages/comissoes.html">
      <div class="link-card-text">
        <div class="link-card-title">Comissões e preços</div>
        <div class="link-card-desc">Tipos, valores e como encomendar</div>
      </div>
      <span class="link-card-arrow">›</span>
    </a>

    <a class="link-card" href="pages/tos.html">
      <div class="link-card-text">
        <div class="link-card-title">Termos de Uso (TOS)</div>
        <div class="link-card-desc">Regras para comissões/uso da arte</div>
      </div>
      <span class="link-card-arrow">›</span>
    </a>

  </div>

  <p class="footer fade-item" style="--delay:1.1s">© 2026 SafiraWolfFox — todos os direitos reservados</p>

</div>

<script src="js/script.js"></script>
</body>
</html>
